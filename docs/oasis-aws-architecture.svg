<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1050" viewBox="0 0 1600 1050" role="img" aria-labelledby="title desc">
  <title id="title">OASIS Magazine AWS 목표 아키텍처</title>
  <desc id="desc">OASIS Magazine을 AWS로 이전할 때의 도메인, CloudFront, S3, API Gateway, Lambda, Cognito, DynamoDB, S3 Media, Secrets Manager, SQS, Autohands SMTP Relay 구조도</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .title { font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #475569; }
      .section-title { font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; font-size: 14px; font-weight: 800; fill: #334155; }
      .node-title { font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; font-size: 17px; font-weight: 800; fill: #0f172a; }
      .node-text { font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #475569; }
      .small { font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #64748b; }
      .tiny { font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #64748b; }
      .badge { font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #ffffff; }
      .box { fill: #ffffff; stroke: #dbe3ee; stroke-width: 1.5; rx: 8; filter: url(#shadow); }
      .box-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; rx: 8; filter: url(#shadow); }
      .box-green { fill: #ecfdf5; stroke: #86efac; stroke-width: 1.5; rx: 8; filter: url(#shadow); }
      .box-amber { fill: #fffbeb; stroke: #facc15; stroke-width: 1.5; rx: 8; filter: url(#shadow); }
      .box-purple { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.5; rx: 8; filter: url(#shadow); }
      .box-rose { fill: #fff1f2; stroke: #fda4af; stroke-width: 1.5; rx: 8; filter: url(#shadow); }
      .lane { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
      .arrow { stroke: #475569; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #94a3b8; stroke-width: 1.8; fill: none; marker-end: url(#arrow); stroke-dasharray: 6 6; }
      .label { font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif; font-size: 12px; font-weight: 800; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="1050"/>

  <text class="title" x="48" y="58">OASIS Magazine AWS 목표 아키텍처</text>
  <text class="subtitle" x="50" y="88">React 정적 웹 + AWS 서버리스 API + 회사 도메인 + Autohands SMTP Relay 기반 이전안</text>
  <rect x="1280" y="34" width="270" height="36" rx="8" fill="#0f172a"/>
  <text class="badge" x="1300" y="57">공유용 구조도 · Infra Review</text>

  <rect class="lane" x="40" y="120" width="310" height="580"/>
  <text class="section-title" x="62" y="148">1. 사용자 / 도메인</text>

  <rect class="box-blue" x="76" y="180" width="238" height="72"/>
  <text class="node-title" x="100" y="211">공개 사용자</text>
  <text class="node-text" x="100" y="234">매거진 조회, 구독 신청</text>

  <rect class="box-purple" x="76" y="280" width="238" height="72"/>
  <text class="node-title" x="100" y="311">관리자</text>
  <text class="node-text" x="100" y="334">기사 분석, 발행, 발송</text>

  <rect class="box" x="76" y="400" width="238" height="86"/>
  <text class="node-title" x="100" y="431">서비스 도메인</text>
  <text class="node-text" x="100" y="454">magazine.autohands.co.kr</text>
  <text class="small" x="100" y="474">또는 인프라팀 지정 도메인</text>

  <rect class="box-amber" x="76" y="530" width="238" height="112"/>
  <text class="node-title" x="100" y="562">DNS / 인증서 / 보안</text>
  <text class="node-text" x="100" y="586">Route 53 또는 사내 DNS</text>
  <text class="node-text" x="100" y="609">ACM TLS Certificate</text>
  <text class="node-text" x="100" y="632">AWS WAF Rate Limit</text>

  <rect class="lane" x="390" y="120" width="290" height="580"/>
  <text class="section-title" x="412" y="148">2. 엣지 / 웹 호스팅</text>

  <rect class="box-blue" x="430" y="210" width="210" height="96"/>
  <text class="node-title" x="456" y="243">CloudFront</text>
  <text class="node-text" x="456" y="266">CDN, HTTPS</text>
  <text class="node-text" x="456" y="286">SPA Routing</text>

  <rect class="box-green" x="430" y="370" width="210" height="90"/>
  <text class="node-title" x="456" y="404">S3 Web Bucket</text>
  <text class="node-text" x="456" y="427">React build assets</text>
  <text class="small" x="456" y="447">CloudFront OAC only</text>

  <rect class="box-purple" x="430" y="535" width="210" height="90"/>
  <text class="node-title" x="456" y="568">API Gateway</text>
  <text class="node-text" x="456" y="591">HTTP API</text>
  <text class="small" x="456" y="611">/api/* origin</text>

  <rect class="lane" x="720" y="120" width="340" height="580"/>
  <text class="section-title" x="742" y="148">3. 인증 / 서버리스 API</text>

  <rect class="box-purple" x="770" y="175" width="240" height="82"/>
  <text class="node-title" x="798" y="207">Cognito User Pool</text>
  <text class="node-text" x="798" y="230">관리자 로그인 / JWT</text>

  <rect class="box" x="770" y="300" width="240" height="82"/>
  <text class="node-title" x="798" y="332">Magazine API Lambda</text>
  <text class="node-text" x="798" y="355">magazines, subscribers</text>

  <rect class="box" x="770" y="410" width="240" height="82"/>
  <text class="node-title" x="798" y="442">Analyze / Frame Lambda</text>
  <text class="node-text" x="798" y="465">기사 분석, iframe 점검</text>

  <rect class="box" x="770" y="520" width="240" height="82"/>
  <text class="node-title" x="798" y="552">Upload / Newsletter API</text>
  <text class="node-text" x="798" y="575">Presigned URL, 발송 요청</text>

  <rect class="lane" x="1100" y="120" width="450" height="580"/>
  <text class="section-title" x="1122" y="148">4. 데이터 / 미디어 / 외부 연동</text>

  <rect class="box-green" x="1140" y="175" width="180" height="82"/>
  <text class="node-title" x="1166" y="207">DynamoDB</text>
  <text class="node-text" x="1166" y="230">매거진, 구독자, 설정</text>

  <rect class="box-green" x="1340" y="175" width="170" height="82"/>
  <text class="node-title" x="1364" y="207">S3 Media</text>
  <text class="node-text" x="1364" y="230">배너, 이메일 이미지</text>

  <rect class="box-rose" x="1140" y="300" width="180" height="82"/>
  <text class="node-title" x="1166" y="332">Secrets Manager</text>
  <text class="node-text" x="1166" y="355">Gemini / SMTP 계정</text>

  <rect class="box-blue" x="1340" y="300" width="170" height="82"/>
  <text class="node-title" x="1364" y="332">CloudWatch</text>
  <text class="node-text" x="1364" y="355">Logs, Metrics, Alarms</text>

  <rect class="box-amber" x="1140" y="430" width="180" height="82"/>
  <text class="node-title" x="1166" y="462">Gemini API</text>
  <text class="node-text" x="1166" y="485">AI 기사 분석</text>

  <rect class="box-amber" x="1340" y="430" width="170" height="82"/>
  <text class="node-title" x="1364" y="462">External Sites</text>
  <text class="node-text" x="1364" y="485">뉴스 / YouTube / GA</text>

  <rect class="box-rose" x="1140" y="555" width="370" height="82"/>
  <text class="node-title" x="1166" y="587">Autohands SMTP Relay</text>
  <text class="node-text" x="1166" y="610">오토핸즈 발송 계정 · 587 STARTTLS 또는 465 SSL</text>

  <rect class="lane" x="40" y="735" width="1510" height="250"/>
  <text class="section-title" x="62" y="763">5. 이전 단계 및 인프라팀 확인 포인트</text>

  <rect class="box-blue" x="76" y="795" width="318" height="120"/>
  <text class="node-title" x="102" y="827">Phase 1 · 호스팅/API 이전</text>
  <text class="node-text" x="102" y="852">S3 + CloudFront 배포</text>
  <text class="node-text" x="102" y="875">Netlify Functions → Lambda</text>
  <text class="small" x="102" y="897">Firebase 데이터는 우선 유지</text>

  <rect class="box-green" x="430" y="795" width="318" height="120"/>
  <text class="node-title" x="456" y="827">Phase 2 · 데이터/인증 이전</text>
  <text class="node-text" x="456" y="852">Firebase Auth → Cognito</text>
  <text class="node-text" x="456" y="875">Firestore → DynamoDB</text>
  <text class="small" x="456" y="897">Storage → S3 Media</text>

  <rect class="box-rose" x="784" y="795" width="318" height="120"/>
  <text class="node-title" x="810" y="827">Phase 3 · 메일/운영</text>
  <text class="node-text" x="810" y="852">Apps Script → SMTP Worker</text>
  <text class="node-text" x="810" y="875">SQS 재시도 / DLQ / 발송 로그</text>
  <text class="small" x="810" y="897">CloudWatch 알람, 비용 알람</text>

  <rect class="box-amber" x="1138" y="795" width="372" height="120"/>
  <text class="node-title" x="1164" y="827">확인 필요</text>
  <text class="node-text" x="1164" y="852">도메인 / DNS 관리 주체 / 인증서</text>
  <text class="node-text" x="1164" y="875">SMTP host, port, TLS, IP allowlist</text>
  <text class="small" x="1164" y="897">SPF/DKIM/DMARC 및 사내망 접근 정책</text>

  <text class="tiny" x="62" y="955">Note. 오토핸즈 SMTP가 사내망 전용이거나 IP allowlist를 요구하면 Lambda를 VPC에 배치하고 NAT Gateway 고정 EIP, VPN 또는 Direct Connect 구성을 검토해야 합니다.</text>

  <path class="arrow" d="M 195 252 L 195 280"/>
  <path class="arrow" d="M 195 352 L 195 400"/>
  <path class="arrow" d="M 195 486 L 195 530"/>
  <path class="arrow" d="M 314 586 C 360 586, 374 258, 430 258"/>
  <path class="arrow" d="M 535 306 L 535 370"/>
  <path class="arrow" d="M 640 258 C 700 258, 700 580, 640 580"/>
  <path class="arrow" d="M 640 580 C 700 580, 710 341, 770 341"/>
  <path class="arrow" d="M 640 580 C 700 580, 710 451, 770 451"/>
  <path class="arrow" d="M 640 580 C 700 580, 710 561, 770 561"/>
  <path class="arrow" d="M 890 257 L 890 300"/>
  <path class="arrow" d="M 1010 341 L 1140 216"/>
  <path class="arrow" d="M 1010 341 C 1060 341, 1085 341, 1140 341"/>
  <path class="arrow" d="M 1010 451 C 1062 451, 1086 471, 1140 471"/>
  <path class="arrow" d="M 1010 451 C 1110 451, 1220 471, 1340 471"/>
  <path class="arrow" d="M 1010 561 C 1060 561, 1085 216, 1340 216"/>
  <path class="arrow" d="M 1010 561 C 1070 561, 1090 596, 1140 596"/>
  <path class="arrow-soft" d="M 1510 216 C 1540 216, 1540 258, 640 258"/>
  <path class="arrow-soft" d="M 1320 341 L 1340 341"/>

  <text class="label" x="343" y="246">HTTPS</text>
  <text class="label" x="660" y="323">/api/*</text>
  <text class="label" x="1046" y="202">CRUD</text>
  <text class="label" x="1050" y="327">Secrets</text>
  <text class="label" x="1052" y="448">Analyze</text>
  <text class="label" x="1048" y="594">Mail</text>
</svg>
